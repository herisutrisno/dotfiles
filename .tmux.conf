# -- general -------------------------------------------------------------------

unbind C-b
set -g prefix C-a 	      # GNU-Screen compatible prefix
bind C-a send-prefix 
set -g mouse on
set-option -g set-clipboard on
set -g terminal-overrides 'xterm*:Tc'
set -g history-limit 10000
setw -g xterm-keys on
set -s escape-time 10         # faster command sequences
set -sg repeat-time 600	      # increase repeat timeout
set -s focus-events on 
setw -q -g utf8 on           
setw -g mode-keys vi          # Use vim-style key bindings
set -g update-environment "SSH_AUTH_SOCK SSH_AGENT_PID"


# Quickly reload tmux config after making changes
bind r source-file ~/.tmux.conf \; display "Configuration reloaded!"

# Layouts
bind t select-layout tiled
bind e select-layout even-horizontal
bind v select-layout even-vertical
bind m select-layout main-vertical
bind M select-layout main-horizontal

# Custom 4-pane tiled layout
bind T split-window -h \; split-window -v \; select-pane -L \; split-window -v \; select-layout tiled

bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"


# -- display -------------------------------------------------------------------
set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows
setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed
set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time
set -g status-interval 10     # redraw status line every 10 seconds
set -g monitor-activity on    # activity
set -g visual-activity off    # activity


